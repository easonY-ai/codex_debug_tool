server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
logging:
  file:
    name: ${TRACE_LENS_LOG_ROOT:${user.home}/.my_logs/codex_analyze}/backend/trace-lens-backend.log
  logback:
    rollingpolicy:
      file-name-pattern: ${TRACE_LENS_LOG_ROOT:${user.home}/.my_logs/codex_analyze}/backend/trace-lens-backend.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 6
      clean-history-on-start: true
  pattern:
    file: 'timestamp=%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%p component=backend event=%msg%n'
  level:
    root: WARN
    dev.tracelens: INFO
spring:
  application:
    name: trace-lens
  sql:
    init:
      mode: never
mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
analyzer:
  database:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/codex_analyze
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    pool:
      maximum-size: 20
      minimum-idle: 1
      connection-timeout-ms: 5000
      socket-timeout-ms: 30000
      connection-time-zone: UTC
      connection-collation: utf8mb4_0900_bin
      session-variables: sql_mode='STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION'
  jsonl:
    enabled: false
    root: ""
    scan-interval-ms: 10000
    max-line-bytes: 16777216
    batch-size: 200
